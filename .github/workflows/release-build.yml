name: Sync Upstream Release and Publish

on:
  schedule:
    # GitHub Actions cron 使用 UTC：UTC+8 的 00:00/06:00/12:00/18:00
    # 对应 UTC 的 16:00/22:00/04:00/10:00
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: unchihugo/FluentFlyout

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check latest upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)
          echo "upstream_tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: force build for ${TAG}"
          elif gh release view "${TAG}" --json id >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already published here, skip"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New upstream release detected: ${TAG}"
          fi

  sync:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream release code
        shell: bash
        run: |
          set -e
          TAG="${{ needs.check.outputs.upstream_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "refs/tags/${TAG}:refs/tags/upstream-${TAG}"
          git merge --no-edit "upstream-${TAG}"
          git tag -f "${TAG}" HEAD
          git push --force origin "refs/tags/${TAG}"
          git push origin master

  build:
    needs: [check, sync]
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    env:
      WAP_PROJECT_PATH: FluentFlyoutMSIX\FluentFlyoutMSIX.wapproj
      CONFIGURATION: GitHub Release
      PLATFORM: x64
      TAG: ${{ needs.check.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: nuget restore FluentFlyout.sln

      - name: Extract app version
        run: |
          [xml]$manifest = Get-Content 'FluentFlyoutMSIX\Package.appxmanifest'
          $fullVersion = $manifest.Package.Identity.Version
          echo "APP_VERSION=$fullVersion" >> $env:GITHUB_ENV

      - name: Build & package MSIX (unsigned)
        run: |
          msbuild $env:WAP_PROJECT_PATH `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\AppxPackages\\" `
            /p:AppxPackageSigningEnabled=false

      - name: Prepare installer structure
        run: |
          $outDir = "$env:GITHUB_WORKSPACE\InstallerOutput"
          New-Item -ItemType Directory -Path $outDir | Out-Null
          $testFolder = Get-ChildItem "$env:GITHUB_WORKSPACE\AppxPackages" -Directory |
            Where-Object { $_.Name -like '*_Test' } | Select-Object -First 1
          Move-Item $testFolder.FullName "$outDir\SystemFiles"
          Copy-Item ".github\build-files\FluentFlyout_Installer.bat" "$outDir\"
          Copy-Item ".github\build-files\README.txt" "$outDir\"

      - name: Create ZIP
        run: Compress-Archive -Path "$env:GITHUB_WORKSPACE\InstallerOutput\*" -DestinationPath "$env:GITHUB_WORKSPACE\FluentFlyout_${env:APP_VERSION}_x64.zip"

      - name: Publish release (create or update)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = "FluentFlyout_${env:APP_VERSION}_x64.zip"
          $relName = gh api "repos/$env:UPSTREAM_REPO/releases/latest" --jq '.name'
          $relBody = gh api "repos/$env:UPSTREAM_REPO/releases/latest" --jq '.body'
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\body.md", $relBody, [System.Text.UTF8Encoding]::new($false))
          gh release view "$env:TAG" --json id 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG" $zip --title "$relName" --notes-file "$env:GITHUB_WORKSPACE\body.md"
          } else {
            gh release upload "$env:TAG" $zip --clobber
            gh release edit "$env:TAG" --title "$relName" --notes-file "$env:GITHUB_WORKSPACE\body.md"
          }
