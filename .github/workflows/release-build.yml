name: Sync Upstream Release and Publish

on:
  schedule:
    # GitHub Actions cron 使用 UTC：UTC+8 的 00:00/06:00/12:00/18:00
    # 对应 UTC 的 16:00/22:00/04:00/10:00
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: unchihugo/FluentFlyout

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check latest upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)
          echo "upstream_tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: force build for ${TAG}"
          # 用显式 API 而非 `gh release view`：本 job 没有 checkout，gh 无法解析默认仓库
          # （gh 依赖 git remote 或 GH_REPO 环境变量），会导致每次都误判"新 release"。
          # GITHUB_REPOSITORY 是 Actions 内置变量（即当前 fork），显式指定语义明确：
          # 200 = 该 tag 的 release 已存在（跳过构建），404 = 未构建过（触发构建）。
          elif gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already published here, skip"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New upstream release detected: ${TAG}"
          fi

  sync:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge upstream release code
        shell: bash
        run: |
          set -e
          TAG="${{ needs.check.outputs.upstream_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "refs/tags/${TAG}:refs/tags/upstream-${TAG}"
          # --no-commit 隐含 --no-ff：merge 停在暂存态而非直接提交，
          # 便于下一步排除 .github/workflows 的上游变更后再统一提交
          git merge --no-commit --no-edit "upstream-${TAG}" || {
            echo "::error::Merge conflicts detected. Resolve manually on your fork."
            git merge --abort
            exit 1
          }
          # GITHUB_TOKEN 没有 workflows 权限：推送任何创建/更新 .github/workflows
          # 文件的 commit 都会被 GitHub 拒绝（remote rejected: refusing to allow
          # a GitHub App to create or update workflow ... without `workflows`
          # permission）。上游偶尔会改自己的 workflow（如 v2.15.0 改了 stale.yml），
          # 故将 .github/workflows 恢复为 fork 自有版本（HEAD，含本 release-build.yml
          # 及已禁用的上游 workflow），该目录不跟随上游同步。
          git restore --source=HEAD --staged --worktree .github/workflows
          # merge 若为 already up to date 则无 MERGE_HEAD，无需提交
          if [ -f .git/MERGE_HEAD ]; then
            git commit --no-edit
          fi
          git tag -f "${TAG}" HEAD
          git push --force origin "refs/tags/${TAG}"
          git push origin master

  build:
    needs: [check, sync]
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    env:
      WAP_PROJECT_PATH: FluentFlyoutMSIX\FluentFlyoutMSIX.wapproj
      CONFIGURATION: GitHub Release
      PLATFORM: x64
      TAG: ${{ needs.check.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: nuget restore FluentFlyout.sln

      - name: Extract app version
        run: |
          [xml]$manifest = Get-Content 'FluentFlyoutMSIX\Package.appxmanifest'
          $fullVersion = $manifest.Package.Identity.Version
          echo "APP_VERSION=$fullVersion" >> $env:GITHUB_ENV

      - name: Derive release version from tag
        shell: bash
        run: |
          REL_VER="${TAG#v}"
          echo "REL_VER=${REL_VER}" >> "$GITHUB_ENV"

      - name: Build & package MSIX (unsigned)
        run: |
          msbuild $env:WAP_PROJECT_PATH `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\AppxPackages\\" `
            /p:AppxPackageSigningEnabled=false

      - name: Prepare installer structure
        run: |
          $outDir = "$env:GITHUB_WORKSPACE\InstallerOutput"
          New-Item -ItemType Directory -Path $outDir | Out-Null
          $testFolder = Get-ChildItem "$env:GITHUB_WORKSPACE\AppxPackages" -Directory |
            Where-Object { $_.Name -like '*_Test' } | Select-Object -First 1
          Move-Item $testFolder.FullName "$outDir\SystemFiles"
          Copy-Item ".github\build-files\FluentFlyout_Installer.bat" "$outDir\"
          Copy-Item ".github\build-files\README.txt" "$outDir\"

      - name: Create ZIP
        run: Compress-Archive -Path "$env:GITHUB_WORKSPACE\InstallerOutput\*" -DestinationPath "$env:GITHUB_WORKSPACE\FluentFlyout_${env:REL_VER}_x64.zip"

      - name: Publish release (create or update)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ZIP="FluentFlyout_${REL_VER}_x64.zip"
          REL_NAME=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.name')
          gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.body' > body.md
          if gh release view "${TAG}" --json id >/dev/null 2>&1; then
            gh release view "${TAG}" --json assets --jq '.assets[].name' | while read -r A; do
              case "${A}" in
                FluentFlyout_*.zip) gh release delete-asset "${TAG}" "${A}" --yes ;;
              esac
            done
            gh release upload "${TAG}" "${ZIP}" --clobber
            gh release edit "${TAG}" --title "${REL_NAME}" --notes-file body.md
          else
            gh release create "${TAG}" "${ZIP}" --title "${REL_NAME}" --notes-file body.md
          fi
